name: Release

# Every push to main: run all of CI, then semantic-release decides from the commits since
# the last vX.Y.Z tag (all commits when there is none) whether
# to release. If so it builds and checks the app (scripts/package-release.sh), tags,
# publishes the GitHub Release with the generated notes, and redeploys the site. It never
# pushes a commit to main. Actions > Release > Run workflow with "dry-run" ticked (the
# default) prints the next version and notes and changes nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run: print the next version and notes; build, tag and publish nothing"
        type: boolean
        default: true

permissions: {}

# Never cancel a release mid-flight; a second push waits.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write      # tag and GitHub Release
      issues: write        # semantic-release opens an issue when a release fails
      pull-requests: write # and comments "released in vX.Y.Z" on the merged PR
    outputs:
      version: ${{ steps.semantic.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # semantic-release needs the full history and tags
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: |
          if [ "$DRY_RUN" = true ]; then npx semantic-release --dry-run; else npx semantic-release; fi

  pages:
    needs: release
    if: needs.release.outputs.version != ''
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
