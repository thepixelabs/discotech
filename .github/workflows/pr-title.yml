name: PR title

# Pull requests are squash-merged, so the title becomes the commit semantic-release reads.
# See the version table in docs/RELEASING.md.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  conventional-title:
    name: Conventional Commit title
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|refactor|docs|style|test|build|ci|chore|revert)(\([^()]+\))?!?: [^[:space:]].*$'
          if [[ "$TITLE" =~ $re ]]; then echo "ok: $TITLE"; exit 0; fi
          echo "::error::\"$TITLE\" is not a Conventional Commit. Use type(scope)!: summary, e.g. \"fix: Layers labels overlap\"."
          exit 1
