<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Discotech</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ece9f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0d13" media="(prefers-color-scheme: dark)">
  <!-- Theme: apply a saved light/dark choice before first paint (no flash). Without it,
       or without JavaScript, the page follows the system setting through CSS. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('discotech-theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
          var c = t === 'dark' ? '#0c0d13' : '#ece9f3';
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute('content', c); });
        }
      } catch (e) {}
    })();
  </script>
  <!-- Root-relative paths: GitHub Pages serves this file for any missing URL, at any depth. -->
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/styles.css">
</head>

  <script>
    // Theme switch: System, Light, Dark, cycled in that order. The icon and label show the
    // current choice. System stores nothing and follows the OS setting live; Light and Dark
    // are kept in this browser (localStorage) and applied before first paint by the script
    // in <head>. Without JavaScript the page follows the system and the switch stays hidden.
    (function () {
      var root = document.documentElement;
      var key = 'discotech-theme';
      var order = ['system', 'light', 'dark'];
      var names = { system: 'System', light: 'Light', dark: 'Dark' };
      var colours = { light: '#ece9f3', dark: '#0c0d13' };
      var toggle = document.querySelector('.theme-toggle');
      var label = document.querySelector('.theme-label');
      var status = document.querySelector('.theme-status');
      var metas = document.querySelectorAll('meta[name="theme-color"]');
      function choice() { return root.getAttribute('data-theme') || 'system'; }
      function paintMeta() {
        var forced = root.getAttribute('data-theme');
        metas.forEach(function (m) {
          var media = m.getAttribute('media') || '';
          m.setAttribute('content', forced ? colours[forced] : (media.indexOf('dark') >= 0 ? colours.dark : colours.light));
        });
      }
      function sync() {
        if (!toggle) { return; }
        var current = choice();
        var next = order[(order.indexOf(current) + 1) % order.length];
        toggle.setAttribute('aria-label', 'Theme: ' + names[current] + '. Switch to ' + names[next]);
        toggle.title = 'Theme: ' + names[current] + '. Click for ' + names[next];
        if (label) { label.textContent = names[current]; }
      }
      function choose(mode) {
        if (mode === 'system') { root.removeAttribute('data-theme'); } else { root.setAttribute('data-theme', mode); }
        try {
          if (mode === 'system') { localStorage.removeItem(key); } else { localStorage.setItem(key, mode); }
        } catch (e) {}
        paintMeta();
        sync();
        if (status) { status.textContent = 'Theme: ' + names[mode]; }
      }
      if (toggle) {
        toggle.hidden = false;
        toggle.addEventListener('click', function () {
          choose(order[(order.indexOf(choice()) + 1) % order.length]);
        });
      }
      paintMeta();
      sync();
    })();
  </script>
</body>
